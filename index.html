<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ruta Segura - Para Mayores</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#1976d2">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, Helvetica, sans-serif; }
        html, body { height: 100%; overflow: hidden; background-color: #f5f5f5; }
        .contenedor { height: 100%; display: flex; flex-direction: column; padding: 12px; gap: 10px; }
        .fila-superior { display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        .nombre-app { font-size: 22px; font-weight: bold; color: #222; text-align: center; flex: 1; padding: 0 10px; }
        .boton-cuadrado { width: 70px; height: 70px; border: none; border-radius: 8px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 2px 5px rgba(0,0,0,0.2); font-weight: bold; flex-shrink: 0; user-select: none; -webkit-user-select: none; }
        .boton-cuadrado .icono { font-size: 24px; margin-bottom: 4px; }
        .boton-cuadrado .texto { font-size: 11px; text-align: center; }
        #botonSOS { background-color: #d32f2f; color: white; position: relative; overflow: hidden; }
        #botonAjustes { background-color: #757575; color: white; }
        #mapa { flex: 1; max-height: 60vh; border-radius: 12px; border: 3px solid #999; min-height: 200px; z-index: 1; }
        #cajaMensaje { background-color: white; border: 2px solid #ccc; border-radius: 10px; padding: 10px; font-size: 18px; flex-shrink: 0; }
        .fila-botones-accion { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; flex-shrink: 0; }
        .boton-accion-cuadrado { height: 70px; border: none; border-radius: 12px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 3px 6px rgba(0,0,0,0.2); font-weight: bold; font-size: 14px; color: white; user-select: none; -webkit-user-select: none; }
        .boton-accion-cuadrado .icono { font-size: 26px; margin-bottom: 4px; }
        #btnCompartir { background-color: #f57c00; }
        #btnLlegueBien { background-color: #43a047; }
        #botonVoz { background-color: #1976d2; }
        #btnRutaRapida { background-color: #388e3c; }
        #botonVoz.escuchando { animation: pulsar 1.5s infinite; }
        @keyframes pulsar { 0% { box-shadow: 0 0 0 0 rgba(25, 118, 210, 0.4); } 70% { box-shadow: 0 0 0 12px rgba(25, 118, 210, 0); } 100% { box-shadow: 0 0 0 0 rgba(25, 118, 210, 0); } }
        #espacioConsejos { height: 70px; background-color: #fff3e0; border: 2px dashed #ffb74d; border-radius: 10px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 8px; font-size: 15px; color: #e65100; font-weight: bold; flex-shrink: 0; transition: opacity 0.3s ease-in-out; }
        footer { height: 50px; line-height: 50px; text-align: center; font-size: 14px; color: #555; background-color: #e8e8e8; border-radius: 8px; flex-shrink: 0; }
        .progreso-sos { position: absolute; bottom: 0; left: 0; width: 0%; height: 6px; background: rgba(255,255,255,0.85); transition: width 1.5s linear; }
        #panelAjustes { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 85%; max-width: 350px; max-height: 85vh; overflow-y: auto; background: white; border-radius: 12px; padding: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); z-index: 100; }
        #panelAjustes h3 { margin-bottom: 15px; font-size: 20px; }
        #panelAjustes button { display: block; width: 100%; padding: 12px; margin: 8px 0; font-size: 17px; border: none; border-radius: 8px; background: #f0f0f0; cursor: pointer; }
        #cerrarAjustes { background: #d32f2f; color: white; margin-top:15px; }
        #botonSalir { background-color: #424242; color: white; }
        #inputDestino { display: none; width: 100%; padding: 12px; margin: 10px 0; font-size: 17px; border: 2px solid #1976d2; border-radius: 8px; }
        #btnBuscarDestino { display: none; width: 100%; padding: 12px; margin: 8px 0; font-size: 17px; border: none; border-radius: 8px; background: #1976d2; color: white; cursor: pointer; font-weight: bold; }
        .panel-datos { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); align-items: center; justify-content: center; padding: 16px; z-index: 200; }
        .panel-datos.visible { display: flex; }
        .panel-datos-contenido { width: 100%; max-width: 420px; max-height: 90vh; overflow-y: auto; background: #fff; border-radius: 14px; padding: 18px; box-shadow: 0 5px 18px rgba(0,0,0,0.35); }
        .panel-datos-cabecera { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
        .panel-datos-cabecera h3 { font-size: 20px; }
        #cerrarDatos { border: none; border-radius: 8px; background: #757575; color: white; padding: 9px 12px; font-size: 16px; cursor: pointer; }
        .form-datos { display: grid; gap: 8px; margin-bottom: 15px; }
        .form-datos input { width: 100%; padding: 11px; font-size: 16px; border: 2px solid #bdbdbd; border-radius: 8px; }
        #guardarDato { width: 100%; padding: 11px; font-size: 17px; font-weight: bold; border: none; border-radius: 8px; background: #1976d2; color: white; cursor: pointer; }
        #listaDatos { display: grid; gap: 8px; }
        .dato-vacio { padding: 12px; color: #555; background: #f5f5f5; border-radius: 8px; text-align: center; }
        .dato-item { padding: 11px; border: 1px solid #ddd; border-radius: 8px; background: #fafafa; }
        .dato-item strong { display: block; font-size: 17px; color: #222; }
        .dato-item small { display: block; margin-top: 4px; color: #555; overflow-wrap: anywhere; }
        .dato-acciones { display: flex; gap: 8px; margin-top: 9px; }
        .dato-acciones button { flex: 1; padding: 8px; border: none; border-radius: 7px; font-size: 15px; cursor: pointer; }
        .btn-principal-dato { background: #e3f2fd; color: #0d47a1; }
        .btn-eliminar-dato { background: #ffebee; color: #b71c1c; }
    </style>
</head>
<body>
    <div class="contenedor">
        <div class="fila-superior">
            <button id="botonSOS" class="boton-cuadrado">
                <span class="icono">&#128681;</span>
                <span class="texto">EMERGENCIA</span>
                <div class="progreso-sos"></div>
            </button>
            <div class="nombre-app">&#129517; RUTA SEGURA</div>
            <button id="botonAjustes" class="boton-cuadrado">
                <span class="icono">&#9881;</span>
                <span class="texto">AJUSTES</span>
            </button>
        </div>
        <div id="mapa"></div>
        <div id="cajaMensaje">&#9989; Todo listo</div>
        <div class="fila-botones-accion">
            <button id="btnCompartir" class="boton-accion-cuadrado">
                <span class="icono">&#128205;</span>
                <span>Compartir</span>
            </button>
            <button id="btnLlegueBien" class="boton-accion-cuadrado">
                <span class="icono">&#127968;</span>
                <span>Llegu&#233; bien</span>
            </button>
            <button id="botonVoz" class="boton-accion-cuadrado">
                <span class="icono">&#127908;</span>
                <span>Hablar</span>
            </button>
            <button id="btnRutaRapida" class="boton-accion-cuadrado">
                <span class="icono">&#129517;</span>
                <span>Ir a...</span>
            </button>
        </div>
        <div id="espacioConsejos">
            &#128161; Consejo: Manten&#233; presionado el bot&#243;n &#128681; por 2 segundos en caso de emergencia.
        </div>
        <footer>Sugerencias a: iaparamayoresapp@gmail.com</footer>
    </div>
    <div id="panelAjustes">
        <h3>&#128203; Mis Datos y Ayuda</h3>
        <input type="text" id="inputDestino" placeholder="Escribí tu destino (ej: Plaza San Martín)">
        <button id="btnBuscarDestino">&#128269; Buscar ruta</button>
        <button id="btnRuta">&#129517; ¿CÓMO LLEGO A...?</button>
        <button id="btnLinterna" style="background:#fff9c4; color:#f57f17;">&#128294; Linterna</button>
        <button id="btnLugares">&#128204; Mis Lugares guardados</button>
        <button id="btnContactos">&#128101; Contactos de confianza</button>
        <hr style="margin:15px 0; border: 1px solid #eee;">
        <p style="font-size:16px; color:#d32f2f; font-weight:bold; margin-bottom:10px;">&#128680; Ayuda Inmediata:</p>
        <button id="btnSalud" style="background:#e8f5e9; color:#2e7d32;">&#127973; Buscar Centro de Salud / Farmacia</button>
        <button id="btnPolicia" style="background:#ffebee; color:#c62828;">&#128110; Llamar a Policía / Emergencias</button>
        <button id="btnHospital" style="background:#fff3e0; color:#e65100;">&#128657; Buscar Hospital con Guardia</button>
        <hr style="margin:15px 0; border: 1px solid #eee;">
        <p style="font-size:16px; color:#1976d2; font-weight:bold; margin-bottom:10px;">&#128205; Destinos útiles:</p>
        <button id="btnBanco" style="background:#e3f2fd; color:#0d47a1;">&#127974; Buscar Banco / Cajero</button>
        <button id="btnSuper" style="background:#f3e5f5; color:#4a148c;">&#128722; Buscar Supermercado</button>
        <button id="btnPlaza" style="background:#e8f5e9; color:#2e7d32;">&#127795; Buscar Plaza / Iglesia</button>
        <hr style="margin:15px 0; border: 1px solid #eee;">
        <button id="botonSalir" style="background:#424242; color:white;">&#128682; SALIR DE LA APP</button>
        <button id="cerrarAjustes" style="background:#d32f2f; color:white;">&#10060; Cerrar</button>
        <button id="btnInstalarManual" style="background:#1976d2; color:white; margin-top:10px; display:none;">📲 Instalar aplicación en el celular</button>
    </div>
    <div id="panelDatos" class="panel-datos" aria-hidden="true">
        <div class="panel-datos-contenido" role="dialog" aria-modal="true" aria-labelledby="tituloDatos">
            <div class="panel-datos-cabecera">
                <h3 id="tituloDatos">Mis datos</h3>
                <button id="cerrarDatos" type="button" aria-label="Cerrar ventana">Cerrar</button>
            </div>
            <div class="form-datos">
                <input type="text" id="inputDatoNombre" placeholder="Nombre" autocomplete="name">
                <input type="text" id="inputDatoValor" placeholder="Dirección o teléfono" autocomplete="off">
                <button id="guardarDato" type="button">Guardar</button>
            </div>
            <div id="listaDatos"></div>
        </div>
    </div>
    <script>
        const botonSOS = document.getElementById('botonSOS');
        const progresoSOS = document.querySelector('.progreso-sos');
        const botonVoz = document.getElementById('botonVoz');
        const cajaMensaje = document.getElementById('cajaMensaje');
        const btnCompartir = document.getElementById('btnCompartir');
        const btnLlegueBien = document.getElementById('btnLlegueBien');
        const botonAjustes = document.getElementById('botonAjustes');
        const panelAjustes = document.getElementById('panelAjustes');
        const cerrarAjustes = document.getElementById('cerrarAjustes');
        const botonSalir = document.getElementById('botonSalir');
        const btnRuta = document.getElementById('btnRuta');
        const btnRutaRapida = document.getElementById('btnRutaRapida');
        const btnSalud = document.getElementById('btnSalud');
        const btnPolicia = document.getElementById('btnPolicia');
        const btnHospital = document.getElementById('btnHospital');
        const btnBanco = document.getElementById('btnBanco');
        const btnSuper = document.getElementById('btnSuper');
        const btnPlaza = document.getElementById('btnPlaza');
        const btnLugares = document.getElementById('btnLugares');
        const btnContactos = document.getElementById('btnContactos');
        const btnLinterna = document.getElementById('btnLinterna');
        const espacioConsejos = document.getElementById('espacioConsejos');
        const inputDestino = document.getElementById('inputDestino');
        const btnBuscarDestino = document.getElementById('btnBuscarDestino');
        const panelDatos = document.getElementById('panelDatos');
        const tituloDatos = document.getElementById('tituloDatos');
        const cerrarDatos = document.getElementById('cerrarDatos');
        const inputDatoNombre = document.getElementById('inputDatoNombre');
        const inputDatoValor = document.getElementById('inputDatoValor');
        const guardarDato = document.getElementById('guardarDato');
        const listaDatos = document.getElementById('listaDatos');
        let miUbicacion = null, reconocimiento = null;
        let temporizadorSOS = null, sosActivo = false;
        let mapaLeaflet = null, marcadorUsuario = null;
        let linternaActiva = false, linternaStream = null;
        const CLAVE_LUGARES = 'rutaSegura_lugares_v1';
        const CLAVE_CONTACTOS = 'rutaSegura_contactos_v1';
        let tipoDatoActual = 'lugares';

        function claveDatosActual() {
            return tipoDatoActual === 'lugares' ? CLAVE_LUGARES : CLAVE_CONTACTOS;
        }

        function leerDatos(clave) {
            try {
                const datos = JSON.parse(localStorage.getItem(clave) || '[]');
                return Array.isArray(datos) ? datos : [];
            } catch (error) {
                return [];
            }
        }

        function guardarDatos(clave, datos) {
            try {
                localStorage.setItem(clave, JSON.stringify(datos));
                return true;
            } catch (error) {
                alert('No se pudieron guardar los datos en este dispositivo.');
                return false;
            }
        }

        function escaparHtml(valor) {
            return String(valor).replace(/[&<>"']/g, caracter => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            }[caracter]));
        }

        function abrirPanelDatos(tipo) {
            tipoDatoActual = tipo;
            const esLugar = tipo === 'lugares';
            tituloDatos.textContent = esLugar ? 'Mis Lugares guardados' : 'Contactos de confianza';
            inputDatoNombre.placeholder = esLugar ? 'Nombre del lugar' : 'Nombre del contacto';
            inputDatoValor.placeholder = esLugar ? 'Dirección o referencia' : 'Teléfono (ej.: 911)';
            inputDatoValor.type = esLugar ? 'text' : 'tel';
            inputDatoValor.inputMode = esLugar ? 'text' : 'tel';
            guardarDato.textContent = esLugar ? 'Guardar lugar' : 'Guardar contacto';
            panelDatos.classList.add('visible');
            panelDatos.setAttribute('aria-hidden', 'false');
            renderizarDatos();
            setTimeout(() => inputDatoNombre.focus(), 0);
        }

        function cerrarPanelDatos() {
            panelDatos.classList.remove('visible');
            panelDatos.setAttribute('aria-hidden', 'true');
            inputDatoNombre.value = '';
            inputDatoValor.value = '';
        }

        function renderizarDatos() {
            const datos = leerDatos(claveDatosActual());
            const esLugar = tipoDatoActual === 'lugares';
            if (!datos.length) {
                listaDatos.innerHTML = esLugar
                    ? '<div class="dato-vacio">Todavía no guardaste ningún lugar.</div>'
                    : '<div class="dato-vacio">Todavía no guardaste ningún contacto.</div>';
                return;
            }
            listaDatos.innerHTML = datos.map((dato, indice) => `
                <div class="dato-item">
                    <strong>${escaparHtml(dato.nombre)}</strong>
                    <small>${escaparHtml(dato.valor)}</small>
                    <div class="dato-acciones">
                        <button type="button" class="btn-principal-dato" data-accion="usar" data-indice="${indice}">${esLugar ? 'Abrir ruta' : 'Llamar'}</button>
                        <button type="button" class="btn-eliminar-dato" data-accion="eliminar" data-indice="${indice}">Eliminar</button>
                    </div>
                </div>
            `).join('');
        }

        function guardarDatoActual() {
            const nombre = inputDatoNombre.value.trim();
            const valor = inputDatoValor.value.trim();
            if (!nombre || !valor) {
                alert(tipoDatoActual === 'lugares' ? 'Completá el nombre y la dirección.' : 'Completá el nombre y el teléfono.');
                return;
            }
            const datos = leerDatos(claveDatosActual());
            datos.push({ nombre, valor });
            if (guardarDatos(claveDatosActual(), datos)) {
                inputDatoNombre.value = '';
                inputDatoValor.value = '';
                renderizarDatos();
                cajaMensaje.textContent = tipoDatoActual === 'lugares' ? 'Lugar guardado.' : 'Contacto guardado.';
                inputDatoNombre.focus();
            }
        }

        function usarDato(indice) {
            const datos = leerDatos(claveDatosActual());
            const dato = datos[indice];
            if (!dato) return;
            if (tipoDatoActual === 'lugares') {
                window.open('https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(dato.valor) + '&travelmode=walking', '_blank');
                cajaMensaje.textContent = 'Abriendo ruta a ' + dato.nombre + '...';
            } else {
                const telefono = dato.valor.replace(/[^\d+]/g, '');
                if (!telefono) {
                    alert('El teléfono guardado no es válido.');
                    return;
                }
                window.location.href = 'tel:' + telefono;
            }
        }

        listaDatos.addEventListener('click', evento => {
            const boton = evento.target.closest('button[data-accion]');
            if (!boton) return;
            const indice = Number(boton.dataset.indice);
            if (boton.dataset.accion === 'usar') {
                usarDato(indice);
                return;
            }
            const datos = leerDatos(claveDatosActual());
            const dato = datos[indice];
            if (dato && confirm('¿Eliminar "' + dato.nombre + '"?')) {
                datos.splice(indice, 1);
                guardarDatos(claveDatosActual(), datos);
                renderizarDatos();
            }
        });

        function inicializarMapa() {
            mapaLeaflet = L.map('mapa').setView([-37.3429, -57.0342], 15);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: 'OpenStreetMap' }).addTo(mapaLeaflet);
        }
        function iniciarSOS() { sosActivo = true; progresoSOS.style.width = '100%'; temporizadorSOS = setTimeout(() => { if(sosActivo) activarSOS(); }, 1500); }
        function cancelarSOS() { sosActivo = false; progresoSOS.style.width = '0%'; if(temporizadorSOS) clearTimeout(temporizadorSOS); }
        botonSOS.addEventListener('mousedown', iniciarSOS);
        botonSOS.addEventListener('touchstart', e=>{e.preventDefault(); iniciarSOS();}, {passive:false});
        botonSOS.addEventListener('mouseup', cancelarSOS);
        botonSOS.addEventListener('touchend', cancelarSOS);
        botonSOS.addEventListener('mouseleave', cancelarSOS);

        function iniciarUbicacion() {
            if (!navigator.geolocation) { cajaMensaje.textContent = "Navegador no compatible"; return; }
            cajaMensaje.textContent = "Buscando tu ubicación...";
            navigator.geolocation.getCurrentPosition(pos => {
                miUbicacion = pos.coords;
                mapaLeaflet.setView([pos.coords.latitude, pos.coords.longitude], 16);
                if (marcadorUsuario) mapaLeaflet.removeLayer(marcadorUsuario);
                marcadorUsuario = L.marker([pos.coords.latitude, pos.coords.longitude]).addTo(mapaLeaflet).bindPopup("&#128205; Estás aquí").openPopup();
                cajaMensaje.textContent = "\u2705 Todo listo";
            }, () => cajaMensaje.textContent = "Activa ubicación en tu teléfono", {enableHighAccuracy: true, timeout:10000});
        }

        function iniciarVoz() {
            window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!window.SpeechRecognition) { cajaMensaje.textContent = "Usa Chrome/Android para voz"; return; }
            if (reconocimiento) { reconocimiento.stop(); botonVoz.classList.remove('escuchando'); return; }
            reconocimiento = new window.SpeechRecognition();
            reconocimiento.lang = 'es-ES'; reconocimiento.continuous = false; reconocimiento.interimResults = false;
            reconocimiento.onstart = () => { botonVoz.classList.add('escuchando'); cajaMensaje.textContent = "Te escucho... decí tu comando"; };
            reconocimiento.onresult = e => {
                cajaMensaje.innerHTML = '&#9989; Dijiste: <strong>"' + e.results[0][0].transcript.toLowerCase() + '"</strong>';
                procesarComando(e.results[0][0].transcript.toLowerCase());
                botonVoz.classList.remove('escuchando'); reconocimiento = null;
            };
            reconocimiento.onerror = () => { botonVoz.classList.remove('escuchando'); cajaMensaje.textContent = "No te escuché bien. Intentá de nuevo."; reconocimiento = null; };
            reconocimiento.onend = () => { botonVoz.classList.remove('escuchando'); reconocimiento = null; };
            reconocimiento.start();
            setTimeout(() => { if (reconocimiento) { reconocimiento.stop(); botonVoz.classList.remove('escuchando'); cajaMensaje.textContent = "Se acabó el tiempo. Tocá el micrófono de nuevo."; reconocimiento = null; } }, 8000);
        }

        function procesarComando(texto) {
            const lugares = { 'hospital': 'hospital cerca de mi', 'farmacia': 'farmacia cerca de mi', 'policia': 'comisaria cerca de mi', 'banco': 'banco cerca de mi', 'supermercado': 'supermercado cerca de mi', 'plaza': 'plaza cerca de mi', 'iglesia': 'iglesia cerca de mi', 'salud': 'centro de salud cerca de mi' };
            let encontroLugar = false;
            for (const [clave, busqueda] of Object.entries(lugares)) {
                if (texto.includes(clave)) {
                    window.open('https://www.google.com/maps/search/' + encodeURIComponent(busqueda), '_blank');
                    encontroLugar = true; cajaMensaje.innerHTML = '&#128269; Buscando <strong>' + busqueda + '</strong> en el mapa...'; break;
                }
            }
            if (!encontroLugar) {
                if (texto.includes("camino") || texto.includes("llegar") || texto.includes("ruta") || texto.includes("ir a")) {
                    panelAjustes.style.display = 'block'; inputDestino.style.display = 'block'; btnBuscarDestino.style.display = 'block'; inputDestino.focus();
                    cajaMensaje.innerHTML += '<br>Escribí o decí tu destino específico';
                } else if (texto.includes("compartir")) { compartirUbicacion(); }
                else if (texto.includes("emergencia") || texto.includes("ayuda") || texto.includes("sos")) { activarSOS(); }
                else if (texto.includes("llegue") || texto.includes("casa")) { llegueBien(); }
                else if (texto.includes("llamar")) { if(confirm("Querés hacer una llamada?")) window.location.href = "tel:"; }
                else { window.open('https://www.google.com/maps/search/' + encodeURIComponent(texto), '_blank'); cajaMensaje.innerHTML = '&#128269; Buscando "<strong>' + texto + '</strong>" en el mapa...'; }
            }
        }

        function compartirUbicacion() {
            if (!miUbicacion) { cajaMensaje.textContent = "No tengo ubicación aún"; return; }
            window.open('https://wa.me/?text=' + encodeURIComponent('Mi ubicación: https://maps.google.com/?q=' + miUbicacion.latitude + ',' + miUbicacion.longitude), '_blank');

        }

        function llegueBien() {

        function activarSOS() {
            if (confirm("¡ATENCIÓN! ¿Activar emergencia? Se avisará a tus contactos de confianza con tu ubicación.")) {
                cajaMensaje.textContent = "SOS ACTIVADO - Avisando a contactos";
            }
        }

        async function toggleLinterna() {
            try {
                if (!linternaActiva) {
                    linternaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                    const track = linternaStream.getVideoTracks()[0];
                    if (track.getCapabilities().torch) {
                        await track.applyConstraints({ advanced: [{ torch: true }] });
                        linternaActiva = true; cajaMensaje.textContent = "Linterna encendida"; btnLinterna.textContent = "Apagar linterna";
                    } else { alert("Tu dispositivo no soporta linterna"); linternaStream.getTracks().forEach(t => t.stop()); linternaStream = null; }
                } else {
                    linternaStream.getTracks().forEach(t => t.stop()); linternaStream = null; linternaActiva = false;
                    cajaMensaje.textContent = "Linterna apagada"; btnLinterna.textContent = "Linterna";
                }
            } catch (e) { alert("No se pudo activar la linterna. Verificá los permisos de cámara."); }
        }

        cerrarAjustes.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); panelAjustes.style.display = 'none'; inputDestino.style.display = 'none'; btnBuscarDestino.style.display = 'none'; inputDestino.value = ''; });
        btnRuta.addEventListener('click', () => {
    inputDestino.style.display = 'block';
    btnBuscarDestino.style.display = 'block';
    inputDestino.focus();
    inputDestino.placeholder = "Ej: Calle 36 y Avenida 7, Hospital, etc.";

    inputDestino.onkeypress = function(e) {

});
        btnBuscarDestino.addEventListener('click', () => {
            const destino = inputDestino.value.trim();
            if (destino) {
                window.open('https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(destino) + '&travelmode=walking', '_blank');
                panelAjustes.style.display = 'none'; inputDestino.style.display = 'none'; btnBuscarDestino.style.display = 'none'; inputDestino.value = '';

    // Permitir buscar presionando Enter
    inputDestino.onkeypress = function(e) {
        if(e.key === 'Enter') {
            btnBuscarDestino.click();
        }
    };
});

        // Lógica para el botón de instalación manual
let deferredPrompt;
const btnInstalarManual = document.getElementById('btnInstalarManual');

window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault(); // Evita que Chrome muestre su aviso automático
    deferredPrompt = e;
    // Mostramos nuestro botón personalizado
    if(btnInstalarManual) btnInstalarManual.style.display = 'block';
});

if(btnInstalarManual) {
    btnInstalarManual.addEventListener('click', async () => {
        if (deferredPrompt) {
            deferredPrompt.prompt(); // Muestra el aviso nativo de instalación
            await deferredPrompt.userChoice; // Espera a que el usuario elija
            deferredPrompt = null; // Limpiamos la variable
            btnInstalarManual.style.display = 'none'; // Ocultamos el botón
        } else {
            alert("La app ya está instalada o tu navegador no permite instalarla desde aquí.");
        }
    });
}

            });
