<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ruta Segura - Para Mayores</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#1976d2">
    
    <!-- Leaflet para el mapa visual -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            background-color: #f5f5f5;
        }

        .contenedor {
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 12px;
            gap: 10px;
        }

        .fila-superior {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .nombre-app {
            font-size: 22px;
            font-weight: bold;
            color: #222;
            text-align: center;
            flex: 1;
            padding: 0 10px;
        }

        .boton-cuadrado {
            width: 70px;
            height: 70px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            font-weight: bold;
            flex-shrink: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        .boton-cuadrado .icono { font-size: 24px; margin-bottom: 4px; }
        .boton-cuadrado .texto { font-size: 11px; text-align: center; }

        #botonSOS { background-color: #d32f2f; color: white; position: relative; overflow: hidden; }
        #botonAjustes { background-color: #757575; color: white; }

        #mapa {
            flex: 1;
            max-height: 60vh;
            border-radius: 12px;
            border: 3px solid #999;
            min-height: 200px;
            z-index: 1;
        }

        #cajaMensaje {
            background-color: white;
            border: 2px solid #ccc;
            border-radius: 10px;
            padding: 10px;
            font-size: 18px;
            flex-shrink: 0;
        }

        /* 🎯 FILA DE 4 BOTONES EN 2x2 */
        .fila-botones-accion {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            flex-shrink: 0;
        }

        .boton-accion-cuadrado {
            height: 70px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 3px 6px rgba(0,0,0,0.2);
            font-weight: bold;
            font-size: 14px;
            color: white;
            user-select: none;
            -webkit-user-select: none;
        }
        .boton-accion-cuadrado .icono { font-size: 26px; margin-bottom: 4px; }

        #btnCompartir { background-color: #f57c00; }
        #btnLlegueBien { background-color: #43a047; }
        #botonVoz { background-color: #1976d2; }
        #btnRutaRapida { background-color: #388e3c; }
        #botonVoz.escuchando { animation: pulsar 1.5s infinite; }
        
        @keyframes pulsar {
            0% { box-shadow: 0 0 0 0 rgba(25, 118, 210, 0.4); }
            70% { box-shadow: 0 0 0 12px rgba(25, 118, 210, 0); }
            100% { box-shadow: 0 0 0 0 rgba(25, 118, 210, 0); }
        }

        #espacioConsejos {
            height: 70px;
            background-color: #fff3e0;
            border: 2px dashed #ffb74d;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 8px;
            font-size: 15px;
            color: #e65100;
            font-weight: bold;
            flex-shrink: 0;
            transition: opacity 0.3s ease-in-out;
        }

        footer {
            height: 50px;
            line-height: 50px;
            text-align: center;
            font-size: 14px;
            color: #555;
            background-color: #e8e8e8;
            border-radius: 8px;
            flex-shrink: 0;
        }

        .progreso-sos {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0%;
            height: 6px;
            background: rgba(255,255,255,0.85);
            transition: width 1.5s linear;
        }

        #panelAjustes {
            display: none;
            position: fixed;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 85%; max-width: 350px;
            max-height: 85vh;
            overflow-y: auto;
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            z-index: 100;
        }
        #panelAjustes h3 { margin-bottom: 15px; font-size: 20px; }
        #panelAjustes button {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            font-size: 17px;
            border: none;
            border-radius: 8px;
            background: #f0f0f0;
            cursor: pointer;
        }
        #cerrarAjustes { background: #d32f2f; color: white; margin-top:15px; }
        #botonSalir { background-color: #424242; color: white; }

        #inputDestino {
            display: none;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            font-size: 17px;
            border: 2px solid #1976d2;
            border-radius: 8px;
        }
        #btnBuscarDestino {
            display: none;
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            font-size: 17px;
            border: none;
            border-radius: 8px;
            background: #1976d2;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <div class="fila-superior">
            <button id="botonSOS" class="boton-cuadrado">
                <span class="icono">🆘</span>
                <span class="texto">EMERGENCIA</span>
                <div class="progreso-sos"></div>
            </button>

            <div class="nombre-app">🧭 RUTA SEGURA</div>

            <button id="botonAjustes" class="boton-cuadrado">
                <span class="icono">⚙️</span>
                <span class="texto">AJUSTES</span>
            </button>
        </div>

        <div id="mapa"></div>

        <div id="cajaMensaje">✅ Lista para ayudarte</div>

        <!-- 🎯 4 BOTONES EN 2x2 -->
        <div class="fila-botones-accion">
            <button id="btnCompartir" class="boton-accion-cuadrado">
                <span class="icono">📍</span>
                <span>Compartir</span>
            </button>
            
            <button id="btnLlegueBien" class="boton-accion-cuadrado">
                <span class="icono">🏠</span>
                <span>Llegué bien</span>
            </button>
            
            <button id="botonVoz" class="boton-accion-cuadrado">
                <span class="icono">🎤</span>
                <span>Hablar</span>
            </button>
            
            <button id="btnRutaRapida" class="boton-accion-cuadrado">
                <span class="icono">🧭</span>
                <span>Ir a...</span>
            </button>
        </div>

        <div id="espacioConsejos">
            💡 Consejo: Mantené presionado el botón 🆘 por 2 segundos en caso de emergencia.
        </div>

        <footer>Sugerencias a: iaparamayoresapp@gmail.com</footer>
    </div>

    <div id="panelAjustes">
        <h3>📋 Mis Datos y Ayuda</h3>
        
        <input type="text" id="inputDestino" placeholder="Escribí tu destino (ej: Plaza San Martín)">
        <button id="btnBuscarDestino">🔍 Buscar ruta</button>
        
        <button id="btnRuta">🧭 ¿CÓMO LLEGO A...?</button>
        <button id="btnLinterna" style="background:#fff9c4; color:#f57f17;"> Linterna</button>
        <button id="btnLugares">📌 Mis Lugares guardados</button>
        <button id="btnContactos">👥 Contactos de confianza</button>
        <hr style="margin:15px 0; border: 1px solid #eee;">
        
        <p style="font-size:16px; color:#d32f2f; font-weight:bold; margin-bottom:10px;"> Ayuda Inmediata:</p>
        
        <button id="btnSalud" style="background:#e8f5e9; color:#2e7d32;">🏥 Buscar Centro de Salud / Farmacia</button>
        <button id="btnPolicia" style="background:#ffebee; color:#c62828;">👮 Llamar a Policía / Emergencias</button>
        <button id="btnHospital" style="background:#fff3e0; color:#e65100;">🚑 Buscar Hospital con Guardia</button>
        
        <hr style="margin:15px 0; border: 1px solid #eee;">
        
        <p style="font-size:16px; color:#1976d2; font-weight:bold; margin-bottom:10px;">📍 Destinos útiles:</p>
        
        <button id="btnBanco" style="background:#e3f2fd; color:#0d47a1;">🏦 Buscar Banco / Cajero</button>
        <button id="btnSuper" style="background:#f3e5f5; color:#4a148c;">🛒 Buscar Supermercado</button>
        <button id="btnPlaza" style="background:#e8f5e9; color:#2e7d32;">🌳 Buscar Plaza / Iglesia</button>
        
        <hr style="margin:15px 0; border: 1px solid #eee;">
        <button id="botonSalir" style="background:#424242; color:white;">🚪 SALIR DE LA APP</button>
        <button id="cerrarAjustes" style="background:#d32f2f; color:white;">✖️ Cerrar</button>
    </div>

    <script>
        const botonSOS = document.getElementById('botonSOS');
        const progresoSOS = document.querySelector('.progreso-sos');
        const botonVoz = document.getElementById('botonVoz');
        const cajaMensaje = document.getElementById('cajaMensaje');
        const mapaDiv = document.getElementById('mapa');
        const btnCompartir = document.getElementById('btnCompartir');
        const btnLlegueBien = document.getElementById('btnLlegueBien');
        const botonAjustes = document.getElementById('botonAjustes');
        const panelAjustes = document.getElementById('panelAjustes');
        const cerrarAjustes = document.getElementById('cerrarAjustes');
        const botonSalir = document.getElementById('botonSalir');
        const btnRuta = document.getElementById('btnRuta');
        const btnRutaRapida = document.getElementById('btnRutaRapida');
        const btnSalud = document.getElementById('btnSalud');
        const btnPolicia = document.getElementById('btnPolicia');
        const btnHospital = document.getElementById('btnHospital');
        const btnBanco = document.getElementById('btnBanco');
        const btnSuper = document.getElementById('btnSuper');
        const btnPlaza = document.getElementById('btnPlaza');
        const btnLugares = document.getElementById('btnLugares');
        const btnContactos = document.getElementById('btnContactos');
        const btnLinterna = document.getElementById('btnLinterna');
        const espacioConsejos = document.getElementById('espacioConsejos');
        const inputDestino = document.getElementById('inputDestino');
        const btnBuscarDestino = document.getElementById('btnBuscarDestino');
        
        let miUbicacion = null, reconocimiento = null;
        let temporizadorSOS = null, sosActivo = false;
        let mapaLeaflet = null, marcadorUsuario = null;
        let linternaActiva = false;
        let linternaStream = null;

        function inicializarMapa() {
            mapaLeaflet = L.map('mapa').setView([-37.3429, -57.0342], 15);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap'
            }).addTo(mapaLeaflet);
        }

        function iniciarSOS() {
            sosActivo = true; 
            progresoSOS.style.width = '100%';
            temporizadorSOS = setTimeout(() => {
                if(sosActivo) activarSOS();
            }, 1500);
        }
        function cancelarSOS() {
            sosActivo = false; 
            progresoSOS.style.width = '0%';
            if(temporizadorSOS) clearTimeout(temporizadorSOS);
        }
        botonSOS.addEventListener('mousedown', iniciarSOS);
        botonSOS.addEventListener('touchstart', e=>{e.preventDefault(); iniciarSOS();}, {passive:false});
        botonSOS.addEventListener('mouseup', cancelarSOS);
        botonSOS.addEventListener('touchend', cancelarSOS);
        botonSOS.addEventListener('mouseleave', cancelarSOS);

        function iniciarUbicacion() {
            if (!navigator.geolocation) {
                cajaMensaje.textContent = "❌ Navegador no compatible";
                return;
            }
            cajaMensaje.textContent = "⏳ Buscando tu ubicación...";
            navigator.geolocation.getCurrentPosition(
                pos => {
                    miUbicacion = pos.coords;
                    const lat = pos.coords.latitude;
                    const lng = pos.coords.longitude;
                    mapaLeaflet.setView([lat, lng], 16);
                    if (marcadorUsuario) mapaLeaflet.removeLayer(marcadorUsuario);
                    marcadorUsuario = L.marker([lat, lng]).addTo(mapaLeaflet)
                        .bindPopup("📍 Estás aquí")
                        .openPopup();
                    cajaMensaje.textContent = "✅ Todo listo";
                },
                () => cajaMensaje.textContent = "⚠️ Activa ubicación en tu teléfono",
                {enableHighAccuracy: true, timeout:10000}
            );
        }

        function iniciarVoz() {
            window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!window.SpeechRecognition) {
                cajaMensaje.textContent = "❌ Usa Chrome/Android para voz";
                return;
            }
            if (reconocimiento) {
                reconocimiento.stop();
                botonVoz.classList.remove('escuchando');
                return;
            }
            reconocimiento = new window.SpeechRecognition();
            reconocimiento.lang = 'es-ES';
            reconocimiento.continuous = false;
            reconocimiento.interimResults = false;
            reconocimiento.onstart = () => { 
                botonVoz.classList.add('escuchando'); 
                cajaMensaje.textContent = "🔊 Te escucho... decí tu comando"; 
            };
            reconocimiento.onresult = e => {
                const frase = e.results[0][0].transcript.toLowerCase();
                cajaMensaje.innerHTML = `✅ Dijiste: <strong>"${frase}"</strong>`;
                procesarComando(frase);
                botonVoz.classList.remove('escuchando');
                reconocimiento = null;
            };
            reconocimiento.onerror = (e) => { 
                botonVoz.classList.remove('escuchando'); 
                cajaMensaje.textContent = "❌ No te escuché bien. Intentá de nuevo.";
                reconocimiento = null;
            };
            reconocimiento.onend = () => {
                botonVoz.classList.remove('escuchando');
                reconocimiento = null;
            };
            reconocimiento.start();
            setTimeout(() => {
                if (reconocimiento) {
                    reconocimiento.stop();
                    botonVoz.classList.remove('escuchando');
                    cajaMensaje.textContent = "⏰ Se acabó el tiempo. Tocá el micrófono de nuevo.";
                    reconocimiento = null;
                }
            }, 8000);
        }

        function procesarComando(texto) {
            const lugares = {
                'hospital': 'hospital cerca de mi',
                'farmacia': 'farmacia cerca de mi',
                'policía': 'comisaria cerca de mi',
                'policia': 'comisaria cerca de mi',
                'banco': 'banco cerca de mi',
                'supermercado': 'supermercado cerca de mi',
                'plaza': 'plaza cerca de mi',
                'iglesia': 'iglesia cerca de mi',
                'salud': 'centro de salud cerca de mi'
            };
            let encontroLugar = false;
            for (const [clave, busqueda] of Object.entries(lugares)) {
                if (texto.includes(clave)) {
                    window.open(`https://www.google.com/maps/search/${encodeURIComponent(busqueda)}`, '_blank');
                    encontroLugar = true;
                    cajaMensaje.innerHTML = `🔍 Buscando <strong>${busqueda}</strong> en el mapa...`;
                    break;
                }
            }
            if (!encontroLugar) {
                if (texto.includes("camino") || texto.includes("llegar") || texto.includes("ruta") || texto.includes("ir a")) {
                    panelAjustes.style.display = 'block';
                    inputDestino.style.display = 'block';
                    btnBuscarDestino.style.display = 'block';
                    inputDestino.focus();
                    cajaMensaje.innerHTML += `<br> Escribí o decí tu destino específico`;
                } else if (texto.includes("compartir")) {
                    compartirUbicacion();
                } else if (texto.includes("emergencia") || texto.includes("ayuda") || texto.includes("sos")) {
                    activarSOS();
                } else if (texto.includes("llegué") || texto.includes("llegue") || texto.includes("casa")) {
                    llegueBien();
                } else if (texto.includes("llamar")) {
                    if(confirm("¿Querés hacer una llamada?")) {
                        window.location.href = "tel:";
                    }
                } else {
                    const url = `https://www.google.com/maps/search/${encodeURIComponent(texto)}`;
                    window.open(url, '_blank');
                    cajaMensaje.innerHTML = `🔍 Buscando "<strong>${texto}</strong>" en el mapa...`;
                }
            }
        }

        function compartirUbicacion() {
            if (!miUbicacion) {
                cajaMensaje.textContent = "⚠️ No tengo ubicación aún";
                return;
            }
            const enlace = `https://wa.me/?text=${encodeURIComponent(`Mi ubicación: https://maps.google.com/?q=${miUbicacion.latitude},${miUbicacion.longitude}`)}`;
            cajaMensaje.textContent = "📤 Abriendo WhatsApp...";
            window.open(enlace, '_blank');
        }

        function llegueBien() {
            if (!miUbicacion) {
                cajaMensaje.textContent = "⚠️ No tengo ubicación aún";
                return;
            }
            const mensaje = `Hola! Llegué bien a casa. Mi ubicación: https://maps.google.com/?q=${miUbicacion.latitude},${miUbicacion.longitude}`;
            const enlace = `https://wa.me/?text=${encodeURIComponent(mensaje)}`;
            cajaMensaje.textContent = " Abriendo WhatsApp...";
            window.open(enlace, '_blank');
        }

        function activarSOS() {
            if (confirm("🚨 ¡ATENCIÓN! ¿Activar emergencia? Se avisará a tus contactos de confianza con tu ubicación.")) {
                cajaMensaje.textContent = " SOS ACTIVADO — Avisando a contactos";
            }
        }

        // 🔦 LINTERNA
        async function toggleLinterna() {
            try {
                if (!linternaActiva) {
                    linternaStream = await navigator.mediaDevices.getUserMedia({ 
                        video: { facingMode: "environment" } 
                    });
                    const track = linternaStream.getVideoTracks()[0];
                    const capabilities = track.getCapabilities();
                    if (capabilities.torch) {
                        await track.applyConstraints({ advanced: [{ torch: true }] });
                        linternaActiva = true;
                        cajaMensaje.textContent = "🔦 Linterna encendida";
                        btnLinterna.textContent = "🔦 Apagar linterna";
                    } else {
                        alert("Tu dispositivo no soporta linterna");
                        linternaStream.getTracks().forEach(t => t.stop());
                        linternaStream = null;
                    }
                } else {
                    linternaStream.getTracks().forEach(t => t.stop());
                    linternaStream = null;
                    linternaActiva = false;
                    cajaMensaje.textContent = "🔦 Linterna apagada";
                    btnLinterna.textContent = "🔦 Linterna";
                }
            } catch (e) {
                alert("No se pudo activar la linterna. Verificá los permisos de cámara.");
            }
        }

        btnSalud.addEventListener('click', () => {
            window.open('https://www.google.com/maps/search/farmacia+o+centro+de+salud+cerca+de+mi', '_blank');
        });
        btnPolicia.addEventListener('click', () => {
            if(confirm("¿Querés llamar ahora al número de emergencias?")) {
                window.location.href = "tel:911"; 
            }
        });
        btnHospital.addEventListener('click', () => {
            window.open('https://www.google.com/maps/search/hospital+con+guardia+cerca+de+mi', '_blank');
        });
        btnBanco.addEventListener('click', () => {
            window.open('https://www.google.com/maps/search/banco+o+cajero+automatico+cerca+de+mi', '_blank');
        });
        btnSuper.addEventListener('click', () => {
            window.open('https://www.google.com/maps/search/supermercado+cerca+de+mi', '_blank');
        });
        btnPlaza.addEventListener('click', () => {
            window.open('https://www.google.com/maps/search/plaza+o+iglesia+cerca+de+mi', '_blank');
        });
        btnLinterna.addEventListener('click', toggleLinterna);

        btnLugares.addEventListener('click', () => {
            alert("📌 Próximamente: Acá vas a poder guardar tus lugares favoritos (casa, médico, etc.)");
        });
        btnContactos.addEventListener('click', () => {
            alert("👥 Próximamente: Acá vas a poder agregar contactos de emergencia que recibirán tu ubicación con el botón SOS.");
        });

        botonSalir.addEventListener('click', () => {
            if(confirm("¿Seguro que querés salir de Ruta Segura?")) {
                cajaMensaje.textContent = "👋 Gracias por usar Ruta Segura. ¡Cuidate!";
                setTimeout(() => { 
                    window.location.replace("https://www.google.com");
                }, 1000);
            }
        });

        botonAjustes.addEventListener('click', () => {
            panelAjustes.style.display = 'block';
            inputDestino.style.display = 'none';
            btnBuscarDestino.style.display = 'none';
        });
        
        cerrarAjustes.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            panelAjustes.style.display = 'none';
            inputDestino.style.display = 'none';
            btnBuscarDestino.style.display = 'none';
            inputDestino.value = '';
        });

        btnRuta.addEventListener('click', () => {
            inputDestino.style.display = 'none';
            btnBuscarDestino.style.display = 'none';
            cajaMensaje.textContent = "📋 Elegí una opción del menú";
        });

        btnBuscarDestino.addEventListener('click', () => {
            const destino = inputDestino.value.trim();
            if (destino) {
                const url = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(destino)}&travelmode=walking`;
                window.open(url, '_blank');
                panelAjustes.style.display = 'none';
                inputDestino.style.display = 'none';
                btnBuscarDestino.style.display = 'none';
                inputDestino.value = '';
            } else {
                alert("⚠️ Escribí un destino primero");
            }
        });

        btnRutaRapida.addEventListener('click', () => {
            panelAjustes.style.display = 'block';
            inputDestino.style.display = 'block';
            btnBuscarDestino.style.display = 'block';
            inputDestino.focus();
            cajaMensaje.textContent = "✏️ Escribí tu destino o tocá el micrófono";
        });

        window.addEventListener('load', () => {
            inicializarMapa();
            iniciarUbicacion();
        });
        
        botonVoz.addEventListener('click', iniciarVoz);
        btnCompartir.addEventListener('click', compartirUbicacion);
        btnLlegueBien.addEventListener('click', llegueBien);

        // 🌤️ CLIMA EN LOS SLIDES
        const mensajes = [
            "💡 Consejo: Mantené presionado el botón 🆘 por 2 segundos en caso de emergencia.",
            "📱 ¿Sabías que podés tocar el micrófono  y decir 'Compartir' para enviar tu ubicación?",
            "🌤️ Cargando clima...",
            "👀 Recordá cargar la batería de tu celular antes de salir a caminar.",
            "📢 Conocé nuestras otras apps educativas en: Cursos IA para Mayores.",
            "🚶♂️ Caminar 20 minutos al día mejora tu salud y tu ánimo. ¡Vos podés!",
            "🏥 En el menú Ajustes tenés acceso directo a hospitales y farmacias.",
            "✈️ ¿Sabías que el modo avión gasta menos batería? Usalo si necesitás ahorrar."
        ];
        
        let indiceMensaje = 0;
        
        async function actualizarClima() {
            try {
                // Usamos format=3 que devuelve texto m�s simple
                const response = await fetch('https://wttr.in/?format=3&lang=es');
                let clima = await response.text();
                
                // Limpiamos el texto por si viene con caracteres raros
                clima = clima.trim().replace(/[<>]/g, '');
                
                // Si el texto es muy largo o tiene c�digo, usamos un fallback
                if (clima.length > 100 || clima.includes('{') || clima.includes('.')) {
                    clima = "Clima no disponible";
                }
                
                mensajes[2] = ` ${clima}`;
            } catch (e) {
                mensajes[2] = " Clima no disponible";
            }
        }
        
        actualizarClima();
        setInterval(actualizarClima, 30 * 60 * 1000);
        
        setInterval(() => {
            indiceMensaje = (indiceMensaje + 1) % mensajes.length;
            espacioConsejos.style.opacity = 0;
            setTimeout(() => {
                espacioConsejos.textContent = mensajes[indiceMensaje];
                espacioConsejos.style.opacity = 1;
            }, 300);
        }, 17000);

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js')
                    .then(reg => console.log('✅ SW registrado correctamente:', reg))
                    .catch(err => console.error('❌ Error al registrar SW:', err));
            });
        }
    </script>
</body>
</html>
